<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7fd5ff">
<meta name="description" content="夏日蓝黄色线条小狗喝水打卡：每天5杯，每杯500ml，支持月度复盘。">
<title>喝水打卡</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--blue:#7fd5ff;--blue2:#b6ecff;--deep:#2c8ec9;--yellow:#ffe36d;--yellow2:#fff3b2;--cream:#fffaf0;--ink:#2d3b43;--muted:#7f98a8;--line:#d6edf9;--card:#ffffffcc;--shadow:0 12px 32px rgba(72,137,177,.18);--r:28px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 7%,rgba(255,227,109,.95),transparent 18%),radial-gradient(circle at 90% 10%,rgba(127,213,255,.95),transparent 20%),linear-gradient(180deg,#9ce0ff 0%,#e9f9ff 30%,#fff2a9 76%,#fffaf0 100%);min-height:100%;}
body{padding:16px 12px 28px}.app{max-width:560px;margin:0 auto}.card{background:var(--card);border:1.5px solid rgba(255,255,255,.65);backdrop-filter:blur(6px);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}.hero{padding:18px;overflow:hidden;position:relative}.hero:before,.hero:after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.22)}.hero:before{width:110px;height:110px;right:-24px;top:-25px}.hero:after{width:76px;height:76px;left:-26px;bottom:-20px}.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}.hero h1{margin:0;font-size:30px;line-height:1.08;font-weight:900}.tag{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 12px;margin-top:10px;font-size:14px;font-weight:800;color:var(--deep);box-shadow:0 8px 18px rgba(83,159,205,.18)}.mascot{width:120px;height:120px;object-fit:cover;border-radius:22px;background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.08);flex:0 0 auto}.goalBox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.badge{background:linear-gradient(180deg,var(--yellow),#ffd04d);padding:8px 14px;border-radius:14px;font-weight:900;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}.goalNum{font-size:46px;font-weight:950;line-height:1}.goalNum small{font-size:26px;color:var(--deep);font-weight:900}.subpill{margin-left:auto;background:#edf8ff;border:1px solid var(--line);color:var(--deep);border-radius:999px;padding:10px 14px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;text-align:center}.stat .lab{color:var(--muted);font-size:13px;font-weight:700}.stat .num{font-size:28px;font-weight:950;line-height:1.15}.sectionTitle{font-size:22px;font-weight:950;margin:0 0 12px}.cups{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.cupWrap{text-align:center}.cupLabel{font-size:13px;color:var(--deep);font-weight:800;margin-bottom:6px}.cupBtn{position:relative;width:100%;aspect-ratio:3/4;border:none;background:none;padding:0;cursor:pointer;transform:translateZ(0)}.cupBtn:active{transform:scale(.95)}.cupBody{position:absolute;inset:8% 14% 18% 14%;border:4px solid #b9b0a0;border-radius:18px 18px 22px 22px;background:linear-gradient(180deg,#fffdf9 0%,#fffaf0 100%);overflow:hidden;box-shadow:0 6px 10px rgba(0,0,0,.04)}.cupBtn.filled .cupBody{border-color:#62aee0}.water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#97dcff 0%,#6ccaff 100%);transition:height .35s cubic-bezier(.2,.9,.2,1.2)}.cupBtn.filled .water{height:76%}.shine{position:absolute;left:14%;top:14%;width:18%;height:55%;border-radius:20px;background:rgba(255,255,255,.65)}.face{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);width:56%;height:42%;z-index:2;opacity:.42;transition:all .25s ease}.cupBtn.filled .face{opacity:1}.eye{position:absolute;top:20%;width:10px;height:10px;background:#3a342e;border-radius:50%}.eye.left{left:20%}.eye.right{right:20%}.mouth{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);width:34px;height:18px;border-bottom:6px solid #3a342e;border-radius:0 0 18px 18px}.blush{position:absolute;top:38%;width:14px;height:10px;border-radius:50%;background:#ffd5de;opacity:.8}.blush.left{left:8%}.blush.right{right:8%}.cupNum{display:inline-grid;place-items:center;margin-top:6px;width:32px;height:32px;border-radius:50%;background:#eef7ff;border:1px solid var(--line);font-weight:900;color:var(--deep)}.cupFilledNum{background:#66b7f3!important;color:#fff!important;border-color:#66b7f3!important}.hint{text-align:center;color:var(--muted);font-size:14px;margin-top:10px;font-weight:700}.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.btn{border:none;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#7fd5ff,#62beef);color:#fff;box-shadow:0 8px 16px rgba(74,156,214,.22)}.btn.light{background:#fff;border:1px solid var(--line);color:var(--deep)}.calHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.navBtn{border:none;background:#edf8ff;border:1px solid var(--line);width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:900;color:var(--deep);cursor:pointer}.monthTitle{font-size:22px;font-weight:950}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekdays div{text-align:center;font-size:13px;color:var(--muted);font-weight:800;padding-bottom:2px}.day{background:#fff;border:1px solid #ecf3f7;border-radius:16px;min-height:68px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative}.day.other{opacity:.38}.day.today{border-color:#ffd04d;box-shadow:0 0 0 3px rgba(255,216,91,.22) inset;background:#fffdf4}.daynum{font-weight:900;font-size:14px}.miniCups{display:flex;gap:1px;flex-wrap:wrap;justify-content:center;margin-top:6px;max-width:42px}.miniCup{width:6px;height:12px;border-radius:3px;border:1.5px solid #b9b0a0;background:#fffaf0}.miniCup.fill{background:#84d9ff;border-color:#62aee0}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:800;margin-top:10px}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.footerNote{text-align:center;color:var(--deep);font-weight:900;padding-bottom:6px}@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.08)}100%{transform:scale(1)}}.cupBtn.pop{animation:pop .35s ease}@media(max-width:450px){.hero h1{font-size:28px}.goalNum{font-size:40px}.stats{grid-template-columns:1fr}.mascot{width:104px;height:104px}}
</style>
</head>
<body>
<div class="app">
<section class="card hero"><div class="hero-top"><div><h1>喝水打卡</h1><div class="tag">☀️ 今天也要乖乖喝水呀 💙</div></div><img class="mascot" src="./icon.svg" alt="线条小狗"></div><div class="goalBox"><span class="badge">今日目标</span><div class="goalNum"><span id="goalMl">2500</span><small> ml</small></div><div class="subpill">5 杯 × 500 ml</div></div><div class="stats"><div class="stat"><div class="lab">今日已喝</div><div class="num"><span id="todayMl">0</span><span style="font-size:18px;color:var(--deep)"> ml</span></div></div><div class="stat"><div class="lab">还差</div><div class="num"><span id="leftMl">2500</span><span style="font-size:18px;color:var(--deep)"> ml</span></div></div><div class="stat"><div class="lab">连续达标</div><div class="num"><span id="streak">0</span><span style="font-size:18px;color:var(--deep)"> 天</span></div></div></div></section>
<section class="card"><h2 class="sectionTitle">今天喝了几杯？</h2><div class="cups" id="cups"></div><div class="hint">点空杯会变满，点最后一杯可以退一杯，交互是 Q 弹的～</div><div class="actions"><button class="btn primary" id="fillAllBtn">今天喝满啦</button><button class="btn light" id="clearBtn">清空今天</button></div></section>
<section class="card"><div class="calHead"><button class="navBtn" id="prevMonth">‹</button><div class="monthTitle" id="monthTitle"></div><button class="navBtn" id="nextMonth">›</button></div><div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="grid" id="calendar"></div><div class="legend"><span><i class="dot" style="background:#84d9ff"></i> 蓝色小杯 = 已喝的杯数</span><span><i class="dot" style="background:#ffe36d"></i> 黄色边框 = 今天</span></div></section>
<div class="footerNote">小狗监督你多喝水，讲课 10h 也要照顾好自己 💧</div></div>
<script>
const KEY='dog-water-checkin-v1',CUP_ML=500,TARGET_CUPS=5,TARGET_ML=CUP_ML*TARGET_CUPS;
const todayKey=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{records:{}}}catch(e){return{records:{}}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}let state=load();if(!state.records)state.records={};
function cupsFor(k){return Math.max(0,Math.min(TARGET_CUPS,Number(state.records[k]||0)))}function setCups(k,v){state.records[k]=Math.max(0,Math.min(TARGET_CUPS,v));save();renderAll()}
function streak(){let n=0,d=new Date();while(true){const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(cupsFor(k)>=TARGET_CUPS){n++;d.setDate(d.getDate()-1)}else break}return n}
let currentMonth=new Date();currentMonth.setDate(1);
function renderStats(){const c=cupsFor(todayKey()),ml=c*CUP_ML;document.getElementById('todayMl').textContent=ml;document.getElementById('leftMl').textContent=Math.max(0,TARGET_ML-ml);document.getElementById('streak').textContent=streak()}
function cupFace(){return`<div class="face"><span class="eye left"></span><span class="eye right"></span><span class="blush left"></span><span class="blush right"></span><span class="mouth"></span></div>`}
function renderCups(){const w=document.getElementById('cups');w.innerHTML='';const f=cupsFor(todayKey());for(let i=0;i<TARGET_CUPS;i++){const x=document.createElement('div');x.className='cupWrap';x.innerHTML=`<div class="cupLabel">500 ml</div><button class="cupBtn ${i<f?'filled':''}" data-index="${i}"><div class="cupBody"><div class="water"></div><div class="shine"></div>${cupFace()}</div></button><div class="cupNum ${i<f?'cupFilledNum':''}">${i+1}</div>`;w.appendChild(x)}w.querySelectorAll('.cupBtn').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.index,n=cupsFor(todayKey()),v=i===n-1?n-1:i+1;setCups(todayKey(),v);requestAnimationFrame(()=>{const q=document.querySelector(`.cupBtn[data-index="${i}"]`);if(q){q.classList.add('pop');setTimeout(()=>q.classList.remove('pop'),350)}})}))}
function fmtMonth(d){return`${d.getFullYear()}年${d.getMonth()+1}月`}function renderCalendar(){document.getElementById('monthTitle').textContent=fmtMonth(currentMonth);const g=document.getElementById('calendar');g.innerHTML='';const y=currentMonth.getFullYear(),m=currentMonth.getMonth(),f=new Date(y,m,1),s=new Date(f);s.setDate(1-f.getDay());for(let i=0;i<42;i++){const d=new Date(s);d.setDate(s.getDate()+i);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,o=d.getMonth()!==m,t=k===todayKey(),c=document.createElement('div');c.className='day'+(o?' other':'')+(t?' today':'');let z='';const n=cupsFor(k);for(let j=0;j<TARGET_CUPS;j++)z+=`<span class="miniCup ${j<n?'fill':''}"></span>`;c.innerHTML=`<div class="daynum">${d.getDate()}</div><div class="miniCups">${z}</div>`;g.appendChild(c)}}function renderAll(){renderStats();renderCups();renderCalendar()}
document.getElementById('prevMonth').addEventListener('click',()=>{currentMonth.setMonth(currentMonth.getMonth()-1);renderCalendar()});document.getElementById('nextMonth').addEventListener('click',()=>{currentMonth.setMonth(currentMonth.getMonth()+1);renderCalendar()});document.getElementById('clearBtn').addEventListener('click',()=>setCups(todayKey(),0));document.getElementById('fillAllBtn').addEventListener('click',()=>setCups(todayKey(),TARGET_CUPS));renderAll();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
