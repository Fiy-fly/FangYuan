deg,#eef3f5,#f5f4f1,#edf2f1);border-radius:18px;padding:14px;margin-top:10px;line-height:1.7;white-space:pre-line}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.met{text-align:center;background:#f8f5f5;border-radius:15px;padding:10px 4px}.met b{font-size:21px;display:block}.met small{color:var(--m)}.ins{border-left:4px solid #97aeb7;background:#f3f7f8;border-radius:10px;padding:9px;margin-top:7px;font-size:12px;line-height:1.55}.calh{display:flex;justify-content:space-between;align-items:center}.calh button{border:0;border-radius:99px;width:34px;height:34px}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;font-size:10px;color:var(--m)}.day{border:1px solid #eee;border-radius:11px;background:#fff;min-height:55px;padding:4px;font-size:11px}.day.sel{border-color:#8fa8b0}.dot{width:22px;height:22px;border-radius:50%;margin:5px auto;background:#eee;display:grid;place-items:center;font-size:9px}.m1{background:#dfe5ec}.m2{background:#e8efe8}.m3{background:#ece5d8}.m4{background:#dbe8ea}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button,.primary,.secondary{border:0;border-radius:14px;padding:11px;font-weight:900}.primary{background:linear-gradient(135deg,#a8b8c0,#8fa8b0);color:#fff}.secondary{background:#f1eded}.danger{background:#fae4e4!important;color:#9d5e5e}.modal{position:fixed;inset:0;background:#344b4c66;display:none;align-items:end;justify-content:center;padding:10px;z-index:50}.modal.on{display:flex}.sheet{width:min(580px,100%);max-height:91vh;overflow:auto;background:white;border-radius:24px;padding:16px}.close{float:right;border:0;border-radius:50%;width:34px;height:34px}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#3d5557;color:white;padding:9px 13px;border-radius:99px;display:none;z-index:80}.empty{text-align:center;color:var(--m);padding:18px;font-size:12px}.privacy{font-size:12px;line-height:1.6;background:#f6f2f2;border-radius:15px;padding:11px}@media(max-width:560px){.app{padding:8px 7px 82px}.hg{grid-template-columns:1.25fr .75fr}.hero h1{font-size:23px}.dog{max-height:145px}.nav{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-radius:18px 18px 0 0;padding-bottom:calc(7px + env(safe-area-inset-bottom));background:#fff}.row{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.card{border-radius:20px;padding:13px}.scale{grid-template-columns:repeat(5,1fr)}}
</style></head><body><div class="app"><section class="card hero"><div class="hg"><div><div class="tag">LITTLE MOMENTS · DAILY JOURNAL</div><h1>LITTLE MOMENTS</h1><p class="q">去看自己，就像去看一片云。</p><div class="date" id="heroDate"></div><div class="cd"><span id="sunCd"></span><span id="vacCd"></span></div></div><img class="dog" src="dog.svg" alt="flower dog"></div></section><nav class="card nav" id="nav"><button data-p="today" class="on">今日记录</button><button data-p="moments">随手记</button><button data-p="review">回顾总结</button><button data-p="data">数据管理</button></nav><main id="main"></main></div><div class="modal" id="modal"><div class="sheet"><button class="close" id="x">×</button><h2 id="modalTitle">添加随手记录</h2><input id="mid" type="hidden"><div class="lab">记录类型</div><select id="mk"></select><div class="lab">发生了什么</div><textarea id="mt" rows="4" placeholder="一句话就可以……"></textarea><div class="lab">当时的感受（可多选）</div><div class="chips" id="mf"></div><div class="row"><div><div class="lab">强度</div><select id="mi"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div><div><div class="lab">分类</div><select id="md"></select></div></div><div class="row"><div><div class="lab">时间</div><input id="mti" type="time"></div><label style="padding-top:34px"><input id="follow" type="checkbox" style="width:auto"> 之后需要处理</label></div><div class="row"><button class="secondary" id="cancel">取消</button><button class="primary" id="saveM">保存这一刻</button></div></div></div><div class="toast" id="toast"></div><input type="file" id="file" accept=".json" hidden><script src="app.js"></script></body></html>
